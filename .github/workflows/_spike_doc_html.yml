name: "[SPIKE] EnergyPlus doc HTML feasibility"

on:
  push:
    branches: [spike/doc-html-poc]
  workflow_dispatch:

jobs:
  spike:
    runs-on: ubuntu-24.04
    steps:
      - name: Sparse checkout EnergyPlus doc folder (v25.2.0)
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch v25.2.0 https://github.com/NatLabRockies/EnergyPlus.git ep
          cd ep
          git sparse-checkout set doc

      - name: Install LaTeX + tex4ht + poppler-utils
        run: |
          sudo apt update
          sudo apt install -y texlive texlive-xetex texlive-science texlive-latex-extra tex4ht poppler-utils

      - name: Generate title.tex from title.tex.in
        working-directory: ep/doc
        run: |
          sed -e 's/\${CMAKE_VERSION_MAJOR}/25/' \
              -e 's/\${CMAKE_VERSION_MINOR}/2/' \
              -e 's/\${CMAKE_VERSION_PATCH}/0/' \
              -e 's/\${CMAKE_VERSION_BUILD}/spike-poc/' \
              title.tex.in > title.tex

      - name: Build official PDF via xelatex (matches EnergyPlus's own CI)
        working-directory: ep/doc/input-output-reference
        continue-on-error: true
        run: |
          export TEXINPUTS=..:
          for i in 1 2 3; do
            xelatex -interaction=nonstopmode input-output-reference.tex || true
          done
          ls -la *.pdf || echo "NO PDF PRODUCED"

      - name: Convert official PDF to HTML via pdftohtml
        working-directory: ep/doc/input-output-reference
        continue-on-error: true
        run: |
          if [ -f input-output-reference.pdf ]; then
            pdftohtml -noframes input-output-reference.pdf pdftohtml-output
          else
            echo "Skipping, no PDF"
          fi

      - name: Locate tex4ht binaries
        run: |
          dpkg -L tex4ht 2>/dev/null | grep -i bin || true
          which make4ht htlatex htxelatex mk4ht 2>&1 || true

      - name: Convert to HTML via make4ht/htlatex
        working-directory: ep/doc/input-output-reference
        continue-on-error: true
        run: |
          export TEXINPUTS=..:
          if command -v make4ht >/dev/null; then
            make4ht -u -x -e "-interaction=nonstopmode" input-output-reference.tex "html,2,fn-in" || true
          elif command -v htxelatex >/dev/null; then
            htxelatex input-output-reference "html,2,fn-in" "" "" "-interaction=nonstopmode" || true
          elif command -v htlatex >/dev/null; then
            htlatex input-output-reference "html,2,fn-in" "" "" "-interaction=nonstopmode" || true
          else
            echo "NO TEX4HT BINARY FOUND"
          fi
          echo "=== after htxelatex wrapper ==="
          ls -la *.html *.css *.idv *.lg 2>/dev/null || echo "NO HTML PRODUCED YET"

      - name: tex4ht/t4ht usage reference
        run: |
          echo "=== tex4ht --help ===" ; tex4ht --help 2>&1 | head -40 || true
          echo "=== t4ht --help ===" ; t4ht --help 2>&1 | head -40 || true

      - name: Manually drive tex4ht/t4ht postprocessing (wrapper skipped this due to missing-char warnings)
        working-directory: ep/doc/input-output-reference
        continue-on-error: true
        run: |
          export TEXINPUTS=..:
          if ls input-output-reference*.html >/dev/null 2>&1; then
            echo "HTML already produced by wrapper, skipping manual postprocessing"
          else
            echo "ATTEMPT 4: tex4ht -.xdv (xelatex produces .xdv, not .dvi) then t4ht"
            tex4ht -.xdv input-output-reference > attempt4a_tex4ht.log 2>&1
            t4ht input-output-reference > attempt4b_t4ht.log 2>&1
            ls input-output-reference*.html 2>/dev/null && echo "ATTEMPT4 (tex4ht -.xdv + t4ht) SUCCESS" || true
          fi
          echo "=== final dir listing ==="
          ls -la input-output-reference*.html *.css *.log 2>/dev/null || echo "STILL NO HTML PRODUCED"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out/make4ht out/pdftohtml out/logs
          cp ep/doc/input-output-reference/input-output-reference.pdf out/ 2>/dev/null || true
          cp ep/doc/input-output-reference/pdftohtml-output*.html out/pdftohtml/ 2>/dev/null || true
          cp ep/doc/input-output-reference/pdftohtml-output*.png out/pdftohtml/ 2>/dev/null || true
          cp ep/doc/input-output-reference/input-output-reference*.html out/make4ht/ 2>/dev/null || true
          cp ep/doc/input-output-reference/*.css out/make4ht/ 2>/dev/null || true
          cp ep/doc/input-output-reference/*.log out/logs/ 2>/dev/null || true
          cp ep/doc/input-output-reference/*.lg out/logs/ 2>/dev/null || true
          cp ep/doc/input-output-reference/attempt*.log out/logs/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doc-html-poc
          path: out
          if-no-files-found: warn
